<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .meu-botao {
            display: inline-block;
            text-decoration: none;
            background-color: #b4f0ff;
            color: #050653;
            padding: 10px 20px;
            margin: 8px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .meu-botao:hover {
            background-color: #232b23;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .meu-botao:active {
            transform: translateY(0);
            box-shadow: none;
        }
        body {
            background-color: #c6f3bb;
        }
    </style>
</head>
<body>
    <h1>Página de vendas</h1>
    <p>Vendas = R$ 5000,00</p>
    <a href="index.html">
        <button class="meu-botao">Voltar para a página inicial</button>
    </a>
</body>
</html>
