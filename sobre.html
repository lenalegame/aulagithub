<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .meu-botao {
            background-color: #b4f0ff;
            color: #050653;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .meu-botao:hover {
            background-color: #232b23;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .meu-botao:active {
            transform: translateY(0);
            box-shadow: none;
        }
        body {
            background-color: #c6f3bb;
        }
    </style>
</head>
<body>
    <h1>Sobre nós</h1>
    <h2>Somos uma equipe confiavel e séria, com mais de 10 anos de experiencia</h2>
    <a href="index.html">
        <button class="meu-botao">Voltar para a página inicial</button>
    </a>
</body>
</html>
